<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Italiano">
<meta name="format-detection" content="telephone=no">
<title>Italiano</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div id="app"><p class="boot">Carregando…</p></div>
<noscript><p class="boot">Ative o JavaScript para usar o app.</p></noscript>
<script>
// Se o navegador for antigo demais ou o carregamento falhar, mostra uma mensagem clara.
window.addEventListener('error', function (e) {
  var el = document.getElementById('app');
  if (el && el.querySelector('.boot')) el.innerHTML = '<p class="boot">Não foi possível carregar o app. Atualize o iOS/Safari ou tente de novo com internet.<br><small>' + (e && e.message ? e.message : '') + '</small></p>';
});
</script>
<script src="./config.js"></script>
<script type="module" src="./assets/boot.js"></script>
</body>
</html>
